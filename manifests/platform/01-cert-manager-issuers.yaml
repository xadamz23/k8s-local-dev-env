# # selfsigned -> mints a CA -> that CA signs everything else.
# # Trust local-ca-tls in your Mac keychain and you get green padlocks:
# #   kubectl -n cert-manager get secret local-ca-tls -o jsonpath='{.data.tls\.crt}' \
# #     | base64 -d > local-ca.crt
# #   sudo security add-trusted-cert -d -k /Library/Keychains/System.keychain local-ca.crt
# apiVersion: cert-manager.io/v1
# kind: ClusterIssuer
# metadata:
#   name: selfsigned
#   annotations:
#     argocd.argoproj.io/sync-wave: "1"
# spec:
#   selfSigned: {}
# ---
# apiVersion: cert-manager.io/v1
# kind: Certificate
# metadata:
#   name: local-ca
#   namespace: cert-manager
#   annotations:
#     argocd.argoproj.io/sync-wave: "2"
# spec:
#   isCA: true
#   commonName: local-dev-ca
#   secretName: local-ca-tls
#   duration: 8760h
#   privateKey:
#     algorithm: ECDSA
#     size: 256
#   issuerRef:
#     name: selfsigned
#     kind: ClusterIssuer
#     group: cert-manager.io
# ---
# apiVersion: cert-manager.io/v1
# kind: ClusterIssuer
# metadata:
#   name: local-ca
#   annotations:
#     argocd.argoproj.io/sync-wave: "3"
# spec:
#   ca:
#     secretName: local-ca-tls
