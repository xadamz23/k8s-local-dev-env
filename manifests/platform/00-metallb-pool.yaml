# Confirm the actual subnet before trusting these addresses:
#   docker network inspect kind -f '{{ (index .IPAM.Config 0).Subnet }}'
# 172.18.0.0/16 is the usual kind default. Pick a range near the top so it
# can't collide with node/container addresses.
apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: kind-pool
  namespace: metallb-system
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  addresses:
    - 172.18.255.200-172.18.255.250
---
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: kind-l2
  namespace: metallb-system
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  ipAddressPools:
    - kind-pool
