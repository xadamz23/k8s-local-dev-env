# # sslip.io resolves *.127.0.0.1.sslip.io -> 127.0.0.1, so hostname-based
# # routing works with zero /etc/hosts editing.
# #
# # Cross-namespace parentRefs are allowed by the Gateway's
# # allowedRoutes.namespaces.from: All -- no ReferenceGrant needed here.
# # (You WOULD need one for a cross-namespace backendRef.)
# apiVersion: gateway.networking.k8s.io/v1
# kind: HTTPRoute
# metadata:
#   name: argocd
#   namespace: argocd
#   annotations:
#     argocd.argoproj.io/sync-wave: "4"
# spec:
#   parentRefs:
#     - name: dev
#       namespace: envoy-gateway-system
#   hostnames:
#     - argocd.127.0.0.1.sslip.io
#   rules:
#     - backendRefs:
#         - name: argocd-server
#           port: 80
# ---
# apiVersion: gateway.networking.k8s.io/v1
# kind: HTTPRoute
# metadata:
#   name: grafana
#   namespace: monitoring
#   annotations:
#     argocd.argoproj.io/sync-wave: "4"
# spec:
#   parentRefs:
#     - name: dev
#       namespace: envoy-gateway-system
#   hostnames:
#     - grafana.127.0.0.1.sslip.io
#   rules:
#     - backendRefs:
#         - name: kube-prometheus-stack-grafana
#           port: 80
