apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: "87.20.0"
    helm:
      values: |
        # Because of the kubeadm patches in kind-cluster.yaml, the control
        # plane scrape targets actually work here. Leave them enabled.
        kubeControllerManager:
          enabled: true
          service:
            port: 10257
            targetPort: 10257
          serviceMonitor:
            https: true
            insecureSkipVerify: true
        kubeScheduler:
          enabled: true
          service:
            port: 10259
            targetPort: 10259
          serviceMonitor:
            https: true
            insecureSkipVerify: true
        kubeEtcd:
          enabled: true
          service:
            port: 2381
            targetPort: 2381
        kubeProxy:
          enabled: true

        grafana:
          adminPassword: admin
          # Reached via the HTTPRoute in manifests/platform/httproutes.yaml
          grafana.ini:
            server:
              root_url: http://grafana.127.0.0.1.sslip.io

        prometheus:
          prometheusSpec:
            retention: 2d
            resources:
              requests: {cpu: 200m, memory: 1Gi}
              limits: {memory: 2Gi}
            storageSpec:
              volumeClaimTemplate:
                spec:
                  storageClassName: standard   # kind's local-path provisioner
                  accessModes: ["ReadWriteOnce"]
                  resources:
                    requests: {storage: 10Gi}

        prometheus-node-exporter:
          prometheus:
            monitor:
              relabelings:
                - targetLabel: cluster
                  replacement: kind-local
                  action: replace
                - sourceLabels: [__meta_kubernetes_pod_node_name]
                  targetLabel: instance
                  action: replace

        kube-state-metrics:
          prometheus:
            monitor:
              relabelings:
                - targetLabel: cluster
                  replacement: kind-local
                  action: replace

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions:
      - CreateNamespace=true
      # NON-OPTIONAL: the Prometheus CRDs blow past the 256KB annotation
      # limit that client-side apply uses. Without this the sync fails.
      - ServerSideApply=true
      - ServerSideDiff=true
