# This is a basic workflow to help you get started with Actions

name: CI

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "main" branch
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v6

      # Runs a single command using the runners shell
      - name: Run a one-line script
        run: echo Hello Adam!

      # Runs a set of commands using the runners shell
      - name: Run a multi-line script
        run: |
          echo Add other actions to build,
          echo test, and deploy your project.
  # I added another job to demonstrate how to run multiple jobs in a workflow
  shebang:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Run a script in the shebang job
        run: |
          echo This is the shebang job!
          echo You can add more steps here as needed.

  # Builds the FastAPI app's container image to prove the Dockerfile is valid.
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      # Sets up Buildx, Docker's extended builder. Needed for the GitHub
      # Actions cache backend (type=gha) used below.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v5

      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          # The Dockerfile does `COPY . /app`, so the context has to be the app
          # directory -- not the repo root.
          context: src/gh-workflow-demo
          # push: false means build-and-discard. We only care that it builds.
          push: false
          tags: gh-workflow-demo:ci
          # Reuse layers from previous runs so `uv sync` doesn't re-download
          # every dependency on each build.
          cache-from: type=gha
          cache-to: type=gha,mode=max
